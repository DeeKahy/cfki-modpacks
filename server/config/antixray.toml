# AntiXray (DrexHD) — hides ores from xray clients.
# Overworld: engine mode 3 obfuscates ore locations among fake ores.
# Nether: engine mode 1 fully hides the valuable blocks until exposed.

[overworld]
enabled = true
engineMode = 3
hiddenBlocks = ["#c:ores", "raw_copper_block", "raw_iron_block", "raw_gold_block"]

[the_nether]
enabled = true
engineMode = 1
hiddenBlocks = ["ancient_debris", "nether_quartz_ore", "nether_gold_ore"]
