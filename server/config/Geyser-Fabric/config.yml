# Geyser — Bedrock crossplay.
# Minimal pre-baked settings; Geyser fills in every other option with
# its defaults on first boot and rewrites this file.

bedrock:
  # Bind on all interfaces; clone-remote-port makes the Bedrock (UDP)
  # listener use the same port number as the Java (TCP) server, so
  # Bedrock players join with the exact same address:port as Java players.
  # Requires the host to forward UDP on that port.
  address: 0.0.0.0
  clone-remote-port: true

java:
  # floodgate = Bedrock players don't need a Java account.
  # Requires the Floodgate mod (included in this pack).
  auth-type: floodgate
