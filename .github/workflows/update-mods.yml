name: Update mods on all version branches

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: |
          branches=$(git branch -r --format='%(refname:short)' \
            | sed 's|^origin/||' \
            | grep '^mc/' \
            | jq -R . | jq -cs .)
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Use tooling from main
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- scripts
          git restore --staged scripts
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Update mods
        run: bash scripts/update-mods.sh
      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/update-${{ matrix.branch }}
          base: ${{ matrix.branch }}
          title: "Mod updates for ${{ matrix.branch }}"
          commit-message: "Update mods (${{ matrix.branch }})"
          body-path: update-report.txt
          add-paths: |
            pack/**
