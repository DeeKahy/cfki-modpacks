name: Scaffold branch for new Minecraft release

on:
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newest:
    # Schedules only fire from the default branch; this also guards manual
    # dispatch from other branches.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pick.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          b=$(git branch -r --format='%(refname:short)' \
            | sed 's|^origin/||' | grep '^mc/' | sort -V | tail -1)
          echo "branch=$b" >> "$GITHUB_OUTPUT"

  scaffold:
    needs: newest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.newest.outputs.branch }}
      - name: Use tooling from main
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- scripts
          git restore --staged scripts
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Check for new release and retarget packs
        id: bump
        run: bash scripts/new-mc-version.sh
      - name: Push mc/<new-version> branch
        if: steps.bump.outputs.version != 'none'
        run: |
          v="${{ steps.bump.outputs.version }}"
          # keep the version branch's own copy of scripts untouched
          git restore --source=HEAD --staged --worktree scripts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server client
          git commit -m "Minecraft $v: initial packs (auto-scaffolded from ${{ needs.newest.outputs.branch }})"
          git push origin "HEAD:refs/heads/mc/$v"
