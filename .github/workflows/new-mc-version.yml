name: Scaffold branch for new Minecraft release

on:
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # main = latest-version branch
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Check for new release and retarget packs
        id: bump
        run: bash scripts/new-mc-version.sh
      - name: Open PR for the new version
        if: steps.bump.outputs.version != 'none'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: mc-bump/${{ steps.bump.outputs.version }}
          base: main
          title: "Minecraft ${{ steps.bump.outputs.version }}"
          commit-message: "Retarget packs at Minecraft ${{ steps.bump.outputs.version }}"
          body-path: update-report.txt
          add-paths: |
            server/**
            client/**
